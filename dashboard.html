<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-blue-600 text-white p-4 shadow-lg">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="font-bold text-lg flex items-center gap-2"><i data-lucide="library"></i> Dashboard</h1>
            <button id="logout" class="bg-white/20 p-2 rounded-full hover:bg-white/30"><i data-lucide="log-out"></i></button>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto p-6">
        <h2 id="welcome" class="text-2xl font-bold text-gray-800 mb-6">Loading...</h2>
        <div id="menu" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </main>
    <script type="module">
        import { auth, db, MASTER_ADMIN_EMAIL } from './js/app.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        lucide.createIcons();

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'index.html'; return; }
            let role = 'Student';
            let name = 'User';
            
            if (user.email === MASTER_ADMIN_EMAIL) {
                role = 'Admin'; name = 'Master Admin';
            } else {
                const docSnap = await getDoc(doc(db, 'users', user.uid));
                if (docSnap.exists()) {
                    role = docSnap.data().role;
                    name = docSnap.data().name;
                }
            }
            document.getElementById('welcome').textContent = `Hello, ${name}!`;
            renderMenu(role);
        });

        function renderMenu(role) {
            const menu = document.getElementById('menu');
            const items = [
                { title: 'Book Catalog', icon: 'search', link: '#' },
                { title: 'My Profile', icon: 'user', link: '#' }
            ];
            if (role === 'Admin') {
                items.push({ title: 'Manage Books', icon: 'book-open', link: 'manage-books.html' });
                items.push({ title: 'User Approvals', icon: 'users', link: '#' });
            }
            menu.innerHTML = items.map(i => `
                <a href="${i.link}" class="bg-white p-6 rounded-2xl border hover:shadow-lg transition-all flex flex-col items-center gap-4">
                    <div class="bg-blue-100 p-4 rounded-full text-blue-600"><i data-lucide="${i.icon}"></i></div>
                    <span class="font-bold text-gray-700">${i.title}</span>
                </a>
            `).join('');
            lucide.createIcons();
        }
        document.getElementById('logout').onclick = () => signOut(auth);
    </script>
</body>
</html>
