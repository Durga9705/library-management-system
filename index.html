<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .blue-gradient { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="blue-gradient p-8 text-white text-center">
            <div class="inline-flex p-3 bg-white/20 rounded-full mb-4"><i data-lucide="library" class="w-10 h-10"></i></div>
            <h1 class="text-2xl font-bold">Library Connect</h1>
        </div>
        <div class="p-8">
            <div id="errorMessage" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm rounded-lg"></div>
            <form id="loginForm" class="space-y-5">
                <input type="email" id="email" required class="block w-full px-3 py-2 border rounded-lg" placeholder="Email">
                <input type="password" id="password" required class="block w-full px-3 py-2 border rounded-lg" placeholder="Password">
                <button type="submit" id="loginBtn" class="w-full blue-gradient text-white font-bold py-3 rounded-lg">Sign In</button>
            </form>
            <p class="mt-4 text-center text-sm">Don't have an account? <a href="register.html" class="text-blue-600 font-bold">Register</a></p>
        </div>
    </div>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
