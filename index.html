<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-blue-600 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden">
        <div class="p-8 text-center">
            <div class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="library" class="text-blue-600 w-8 h-8"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Library Connect</h1>
        </div>
        <div class="p-8 pt-0">
            <div id="error" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-xs rounded-lg"></div>
            <form id="loginForm" class="space-y-4">
                <input type="email" id="email" placeholder="Email" required class="w-full p-3 border rounded-xl outline-none">
                <input type="password" id="password" placeholder="Password" required class="w-full p-3 border rounded-xl outline-none">
                <button type="submit" id="loginBtn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">Sign In</button>
            </form>
            <p class="mt-6 text-center text-sm">New user? <a href="register.html" class="text-blue-600 font-bold">Register Now</a></p>
        </div>
    </div>
    <script type="module">
        import { auth, db, MASTER_ADMIN_EMAIL, MASTER_ADMIN_PASS } from './app.js';
        import { signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        lucide.createIcons();
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                if (email === MASTER_ADMIN_EMAIL && pass === MASTER_ADMIN_PASS) { window.location.href = 'dashboard.html'; return; }
                const userCred = await signInWithEmailAndPassword(auth, email, pass);
                const userDoc = await getDoc(doc(db, 'users', userCred.user.uid));
                if (userDoc.exists() && (userDoc.data().isApproved || userDoc.data().role === 'Admin')) {
                    window.location.href = 'dashboard.html';
                } else { alert("Account not approved!"); await signOut(auth); }
            } catch (err) { alert("Invalid credentials!"); }
        };
    </script>
</body>
</html>
