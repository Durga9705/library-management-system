<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Manage Books</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-2xl shadow-lg">
        <h1 class="text-2xl font-bold text-blue-600 mb-6">Add New Book</h1>
        <form id="bookForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="text" id="title" placeholder="Book Title" required class="p-2 border rounded">
            <input type="text" id="author" placeholder="Author" required class="p-2 border rounded">
            <button type="submit" class="md:col-span-2 bg-blue-600 text-white font-bold py-3 rounded">Add Book</button>
        </form>
    </div>
    <script type="module">
        import { db } from './app.js';
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        document.getElementById('bookForm').onsubmit = async (e) => {
            e.preventDefault();
            try {
                await addDoc(collection(db, 'books'), {
                    title: document.getElementById('title').value,
                    author: document.getElementById('author').value
                });
                alert('Book added successfully!');
            } catch (err) { alert(err.message); }
        };
    </script>
</body>
</html>
