<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Books</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-2xl shadow-lg">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-blue-600">Add New Book</h1>
            <a href="dashboard.html" class="text-sm text-gray-500">Back</a>
        </div>
        <form id="bookForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="text" id="title" placeholder="Book Title" required class="p-2 border rounded">
            <input type="text" id="author" placeholder="Author" required class="p-2 border rounded">
            <input type="text" id="category" placeholder="Category" class="p-2 border rounded">
            <input type="number" id="stock" placeholder="Stock Count" class="p-2 border rounded">
            <input type="text" id="isbn" placeholder="ISBN" class="p-2 border rounded">
            <input type="text" id="shelf" placeholder="Shelf Number" class="p-2 border rounded">
            <button type="submit" class="md:col-span-2 bg-blue-600 text-white font-bold py-3 rounded">Add Book</button>
        </form>
    </div>
    <script type="module">
        import { db } from './js/app.js';
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        
        document.getElementById('bookForm').onsubmit = async (e) => {
            e.preventDefault();
            try {
                await addDoc(collection(db, 'books'), {
                    title: document.getElementById('title').value,
                    author: document.getElementById('author').value,
                    category: document.getElementById('category').value,
                    stock: document.getElementById('stock').value,
                    isbn: document.getElementById('isbn').value,
                    shelf: document.getElementById('shelf').value
                });
                alert('Book added successfully!');
                e.target.reset();
            } catch (err) { alert(err.message); }
        };
    </script>
</body>
</html>
